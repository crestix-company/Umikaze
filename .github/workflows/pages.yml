name: Publish Umikaze website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify the website
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build
          npm test
          npm run verify
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified website
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify published pages, images, and videos
        env:
          SITE_BASE_PATH: ${{ needs.build.outputs.base_path }}/
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm run build
          for attempt in 1 2 3 4 5; do
            if node scripts/verify.mjs "$SITE_URL"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
